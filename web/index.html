<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffe14d'/%3E%3Cpath d='M9 9l14 14M23 9L9 23' stroke='%231d2230' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">Clip <mark>Studio</mark></div>
      <nav class="nav" aria-label="Разделы">
        <button data-view="studio">Студия</button>
        <button data-view="videos">Видео <span class="count" id="nav-videos"></span></button>
        <button data-view="sources">Источники и права</button>
        <button data-view="clips">Клипы <span class="count" id="nav-clips"></span></button>
        <button data-view="pubs">Публикации</button>
        <button data-view="settings">Настройки</button>
        <button data-view="guide">Гайд</button>
      </nav>
      <div class="health" id="health" aria-live="polite"></div>
      <button class="theme-toggle" id="theme-toggle" type="button">Тема: авто</button>
    </aside>
    <main id="main"><div class="view"><p class="muted">Загрузка…</p></div></main>
  </div>

  <dialog id="dialog"><div class="dlg" id="dialog-body"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
