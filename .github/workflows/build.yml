name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Зависимости
        run: pip install -r requirements.txt pytest httpx
      - name: Тесты
        run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: ffmpeg (сборка BtbN, GPL, с libass)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $src = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path packaging/ffmpeg | Out-Null
          Copy-Item "$($src.FullName)/bin/*" packaging/ffmpeg/
          Copy-Item "$($src.FullName)/LICENSE.txt" packaging/ffmpeg/ -ErrorAction SilentlyContinue
          Remove-Item packaging/ffmpeg/ffplay.exe -ErrorAction SilentlyContinue
      - name: Сборка
        run: pyinstaller packaging/clipstudio.spec --noconfirm
      - name: Проверка запуска
        shell: pwsh
        run: |
          $out = & dist/ClipStudio/ClipStudio.exe status
          $out | Write-Output
          if (-not ($out -match '"ready": true')) { throw "status не ответил" }
          Remove-Item dist/ClipStudio/config.yaml, dist/ClipStudio/sources.yaml, dist/ClipStudio/.env -ErrorAction SilentlyContinue
          Remove-Item dist/ClipStudio/data -Recurse -ErrorAction SilentlyContinue
      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path dist/ClipStudio -DestinationPath ClipStudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-windows
          path: ClipStudio-windows.zip
          retention-days: 30
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClipStudio-windows.zip
          body: |
            Готовая программа для Windows 10/11. Распакуйте архив в «Документы» и запустите ClipStudio.exe.
            ffmpeg внутри. Для поиска моментов нужен Claude Code (подписка Pro/Max) или ручной режим.
            Методичка: docs/manual.html в архиве и в репозитории.
