name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Зависимости
        run: pip install -r requirements.txt pytest httpx
      - name: Тесты
        run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: ffmpeg (сборка BtbN, GPL, с libass)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $src = Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path packaging/ffmpeg | Out-Null
          Copy-Item "$($src.FullName)/bin/*" packaging/ffmpeg/
          Copy-Item "$($src.FullName)/LICENSE.txt" packaging/ffmpeg/ -ErrorAction SilentlyContinue
          Remove-Item packaging/ffmpeg/ffplay.exe -ErrorAction SilentlyContinue
      - name: Сборка
        run: pyinstaller packaging/clipstudio.spec --noconfirm
      - name: Проверка запуска и нарезки на Windows
        shell: pwsh
        run: |
          Set-Location dist/ClipStudio
          $status = & ./ClipStudio.exe status | Out-String
          $status | Write-Output
          if (-not ($status -match '_internal')) { Write-Output "внимание: ffmpeg не из сборки" }
          & ./_internal/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25:duration=20 -f lavfi -i sine=frequency=440:duration=20 -c:v libx264 -c:a aac -shortest test.mp4
          "1`n00:00:01,000 --> 00:00:04,000`nПроверка субтитров на Windows`n`n2`n00:00:06,000 --> 00:00:09,000`nВторая фраза после паузы`n" | Out-File -Encoding utf8 test.srt
          & ./ClipStudio.exe import test.mp4 --source me --subs test.srt
          & ./ClipStudio.exe cut 1 0.5 10 --title "Тест" --hook "ПРОВЕРКА" --jumpcut
          if (-not (Test-Path data/clips/1.mp4)) { throw "клип не создан" }
          & ./ClipStudio.exe export 1 --format edl
          Remove-Item test.mp4, test.srt, config.yaml, sources.yaml, .env -ErrorAction SilentlyContinue
          Remove-Item data -Recurse -ErrorAction SilentlyContinue
      - name: Методичка и README в архив
        shell: pwsh
        run: |
          Copy-Item docs/manual.html dist/ClipStudio/Metodichka-ClipStudio.html
          Copy-Item packaging/README.txt dist/ClipStudio/README.txt
      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path dist/ClipStudio -DestinationPath ClipStudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-windows
          path: ClipStudio-windows.zip
          retention-days: 30
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ClipStudio-windows.zip
          body: |
            Готовая программа для Windows 10/11. Распакуйте архив в «Документы» и запустите ClipStudio.exe.
            ffmpeg внутри. Для поиска моментов нужен Claude Code (подписка Pro/Max) или ручной режим.
            Методичка: docs/manual.html в архиве и в репозитории.
